---
name: Build and publish a Docker images

'on':
    pull_request:
    push:
      branches:
        - master
      paths-ignore:
        - '**.md'
    workflow_dispatch:

jobs:
    build:
        name: Build
        strategy:
            fail-fast: false
            matrix:
                image:
                    - rhel8-systemd
                    - rhel9-systemd
                    - rockylinux8-systemd
                    - rockylinux9-systemd
                    - ubuntu2004-systemd
                    - ubuntu2204-systemd
                    - ubuntu2404-systemd
                    - ubuntu2604-systemd
                runner:
                    - ubuntu-24.04
                    - ubuntu-24.04-arm
                # UBI 7 and centos/systemd have no arm64 image
                include:
                    - image: rhel7-systemd
                      runner: ubuntu-24.04
                    - image: centos7-systemd
                      runner: ubuntu-24.04

        runs-on: ${{matrix.runner}}

        steps:
            - uses: actions/checkout@v4

            - name: Set architecture tag
              id: arch
              run: |
                if [[ "${{matrix.runner}}" == *"-arm"* ]]; then
                  echo "arch=arm64" >> $GITHUB_OUTPUT
                else
                  echo "arch=amd64" >> $GITHUB_OUTPUT
                fi

            - name: Build image
              run: docker build -t ghcr.io/${{github.repository_owner}}/${{matrix.image}}:${{steps.arch.outputs.arch}} ${{matrix.image}}

            - name: Test image
              run: docker run -d --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw ghcr.io/${{github.repository_owner}}/${{matrix.image}}:${{steps.arch.outputs.arch}} systemctl status

            - name: Login to GitHub Container Registry
              if: ${{ github.ref == 'refs/heads/master' }}
              run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

            - name: Push image
              if: ${{ github.ref == 'refs/heads/master' }}
              run: docker push ghcr.io/${{github.repository_owner}}/${{matrix.image}}:${{steps.arch.outputs.arch}}

    publish_manifest:
        name: Publish Multi-arch Manifest
        needs: build
        runs-on: ubuntu-latest
        if: ${{ github.ref == 'refs/heads/master' }}

        strategy:
            fail-fast: false
            matrix:
                image:
                    - rhel8-systemd
                    - rhel9-systemd
                    - rockylinux8-systemd
                    - rockylinux9-systemd
                    - ubuntu2004-systemd
                    - ubuntu2204-systemd
                    - ubuntu2404-systemd
                    - ubuntu2604-systemd
                include:
                    - image: rhel7-systemd
                      arches: amd64
                    - image: centos7-systemd
                      arches: amd64

        steps:
            - name: Login to GitHub Container Registry
              run: echo "${{secrets.GITHUB_TOKEN}}" | docker login ghcr.io -u ${{github.actor}} --password-stdin

            - name: Create and push manifest
              run: |
                refs=""
                for arch in ${{ matrix.arches || 'amd64 arm64' }}; do
                  refs="$refs ghcr.io/${{github.repository_owner}}/${{matrix.image}}:$arch"
                done
                docker manifest create ghcr.io/${{github.repository_owner}}/${{matrix.image}}:latest $refs
                docker manifest push ghcr.io/${{github.repository_owner}}/${{matrix.image}}:latest
